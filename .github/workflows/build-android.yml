name: Build Android App (APK & AAB)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js for Capacitor (Export)
        run: mkdir -p out && echo "<html><body>Redirecting...</body></html>" > out/index.html

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Keystore for Release Signing
        run: |
          cd android/app
          if [ ! -f "ayudarte-release-key.jks" ]; then
            keytool -genkey -v -keystore ayudarte-release-key.jks -alias ayudarte -keyalg RSA -keysize 2048 -validity 10000 -storepass ayudarte2026 -keypass ayudarte2026 -dname "CN=Ayudarte, OU=Mobile, O=Ayudarte, L=Buenos Aires, ST=Buenos Aires, C=AR"
          fi

      - name: Build Android Debug APK (Para probar en celulares)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build Android Release AAB (Para subir a Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK (Para instalar en celulares)
        uses: actions/upload-artifact@v4
        with:
          name: ayudarte-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (Google Play Store Bundle Firmado)
        uses: actions/upload-artifact@v4
        with:
          name: ayudarte-app-release.aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Keystore (Copia de seguridad de la firma)
        uses: actions/upload-artifact@v4
        with:
          name: ayudarte-keystore.jks
          path: android/app/ayudarte-release-key.jks
